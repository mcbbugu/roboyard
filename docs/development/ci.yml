name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 26.3
        run: sudo xcode-select -s /Applications/Xcode_26.3.app
      - name: Test behavior, memory, and collisions
        run: swift test
      - name: Build app bundle
        run: scripts/bundle.sh
      - name: Verify signature
        run: codesign --verify --deep --strict dist/RoboYard.app
      - name: Preserve app permissions in ZIP
        run: ditto -c -k --sequesterRsrc --keepParent dist/RoboYard.app dist/RoboYard-macOS.zip
      - uses: actions/upload-artifact@v4
        with:
          name: RoboYard-macOS
          path: dist/RoboYard-macOS.zip
